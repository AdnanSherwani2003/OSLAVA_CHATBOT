name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Typecheck, Test & Audit
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_PUBLISHABLE_KEY: test-publishable-key-for-ci
      CHAT_PERSISTENCE_MODE: memory
      GROQ_API_KEY: test-groq-key-for-ci
      APP_TIMEZONE: Asia/Kolkata

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Offline Unit & Acceptance Tests
        run: npm test

      - name: Run Production TypeScript Build
        run: npm run build

      - name: Verify Production Dependencies Security
        run: npm audit --omit=dev
